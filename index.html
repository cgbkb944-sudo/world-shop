<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World TG Shop</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .balance-card {
            background: linear-gradient(135deg, #4b2e83, #7b42bc);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .balance-title {
            font-size: 14px;
            color: #dcd6f7;
            margin-bottom: 5px;
        }
        .balance-amount {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn {
            background-color: #7b42bc;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #68359f;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #222222;
            width: 90%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: none; border: none;
            color: #aaa; font-size: 20px; cursor: pointer;
        }
        .input-group {
            margin: 15px 0;
            text-align: left;
        }
        .input-group label {
            font-size: 13px; color: #aaa; display: block; margin-bottom: 5px;
        }
        .input-group input {
            width: 100%; padding: 10px; border-radius: 8px;
            border: 1px solid #444; background: #111; color: white; box-sizing: border-box;
            font-size: 16px;
        }
        .payment-methods {
            display: flex; flex-direction: column; gap: 10px; margin-top: 15px;
        }
        .method-btn {
            background: #333; border: 1px solid #444; color: white;
            padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px;
            transition: 0.2s;
        }
        .method-btn:hover {
            background: #444;
        }
        #direct-payment-info {
            display: none; text-align: center;
        }
        .timer {
            font-size: 18px; color: #ff9800; font-weight: bold; margin: 10px 0;
        }
        .wallet-address {
            background: #111; padding: 8px; border-radius: 6px;
            font-size: 11px; word-break: break-all; border: 1px dashed #555; margin: 10px 0;
            color: #4CAF50;
            text-align: left;
        }
        .comment-box {
            background: #1a1a1a;
            border: 1px solid #ff9800;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            margin: 10px 0;
            color: #ff9800;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="balance-card">
            <div class="balance-title">ВАШ БАЛАНС</div>
            <div class="balance-amount">0.00 ₽</div>
            <button class="btn" onclick="openModal()">Пополнить баланс</button>
        </div>
        
        <div style="margin-top: 20px;">
            <h3>Сообщения и заказы</h3>
            <p style="color: #777; font-size: 14px;">У вас пока нет входящих сообщений.</p>
        </div>
    </div>

    <!-- Модальное окно пополнения -->
    <div id="topupModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3>Пополнить баланс</h3>
            
            <div id="step-amount">
                <div class="input-group">
                    <label>Введите сумму пополнения</label>
                    <input type="number" id="topup-amount" value="100" min="10">
                </div>
                
                <div class="payment-methods">
                    <button class="method-btn" onclick="selectMethod('cryptobot')">💎 Crypto Bot</button>
                    <button class="method-btn" onclick="selectMethod('stars')">⭐ Telegram Stars</button>
                    <button class="method-btn" onclick="selectMethod('direct')">🔗 Прямой перевод (TON / USDT)</button>
                </div>
            </div>

            <!-- Экран прямого перевода с генерацией ссылки и комментария -->
            <div id="direct-payment-info">
                <p style="font-size: 13px; color: #ccc; margin: 5px 0;">Важно: Обязательно укажите комментарий при переводе!</p>
                <div class="timer" id="payment-timer">10:00</div>
                
                <div class="comment-box" id="pay-comment">Комментарий: загрузка...</div>
                
                <!-- QR-код со вшитой ton:// ссылкой -->
                <img id="qr-image" src="" alt="QR Code" style="width: 140px; height: 140px; margin: 5px 0; border-radius: 8px; background: #fff; padding: 5px;">
                
                <div class="wallet-address">Адрес: <span id="wallet-addr">UQBVqIZqbAt0CCiboMZ38hdBGjN7RkEZKLUuDX2F5zPRwG1v</span></div>
                
                <a id="pay-link" href="#" class="btn" style="margin-top: 10px; background: #2f80ed;" target="_blank">Открыть кошелек TON</a>
                
                <button class="btn" style="background: #444; margin-top: 8px;" onclick="resetModal()">Назад</button>
            </div>
        </div>
    </div>

    <script>
        const OWNER_WALLET = "UQBVqIZqbAt0CCiboMZ38hdBGjN7RkEZKLUuDX2F5zPRwG1v";

        function openModal() {
            document.getElementById('topupModal').style.display = 'flex';
            document.getElementById('step-amount').style.display = 'block';
            document.getElementById('direct-payment-info').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('topupModal').style.display = 'none';
        }

        function selectMethod(method) {
            const amount = document.getElementById('topup-amount').value;
            if (method === 'direct') {
                document.getElementById('step-amount').style.display = 'none';
                document.getElementById('direct-payment-info').style.display = 'block';
                
                // Генерация уникального комментария
                const uniqueComment = Math.floor(Date.now() / 1000) + "_" + Math.floor(100000 + Math.random() * 900000);
                document.getElementById('pay-comment').innerText = "Комментарий: " + uniqueComment;

                // Создание диплинк-ссылки ton://transfer/... с зашитым кошельком и текстом
                const tonTransferUrl = `ton://transfer/${OWNER_WALLET}?text=${encodeURIComponent(uniqueComment)}`;
                document.getElementById('pay-link').href = tonTransferUrl;

                // Генерация QR-кода, ведущего на эту ссылку
                const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(tonTransferUrl)}`;
                document.getElementById('qr-image').src = qrApiUrl;

                startTimer(10 * 60); // Таймер на 10 минут
            } else {
                alert(`Оплата через ${method} на сумму ${amount} ₽`);
                closeModal();
            }
        }

        function resetModal() {
            document.getElementById('step-amount').style.display = 'block';
            document.getElementById('direct-payment-info').style.display = 'none';
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            const display = document.getElementById('payment-timer');
            if (window.paymentInterval) clearInterval(window.paymentInterval);

            window.paymentInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(window.paymentInterval);
                    display.textContent = "Время истекло";
                }
            }, 1000);
        }

        window.onclick = function(event) {
            const modal = document.getElementById('topupModal');
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
